# ─── Project Template CI ──────────────────────────────────────────────────────
#
# Governance-layer pipeline. Stack-specific jobs go in ci/*.yml — uncomment
# the relevant include line below.
#
# Includes:
#   ci/python.yml    — ruff, pytest, coverage, license check; plus an optional
#                      schema fuzz (schemathesis) and nightly load test
#                      (p95 budget), both inert until you wire up the API-boot
#                      hook script each one names — see that file's header
#   ci/node.yml      — eslint, vitest, coverage, npm audit, license check
#   ci/docker.yml    — kaniko build verification
#   ci/go.yml        — golangci-lint, go test, govulncheck
#   ci/docs.yml      — internal doc link/anchor/asset checker (always
#                      included; self-gates on whether a docs site exists —
#                      see that file's header, not this one, before touching
#                      the include line below)
#   ci/helm.yml      — registry-shadow drift (scheduled), install/upgrade
#                      drills on a real kind cluster. Unlike the four above,
#                      most clones never need this — only uncomment it once
#                      you actually have a Helm chart (see ci/helm.yml's own
#                      header for HELM_CHART_DIR etc.). Every job in it is
#                      also gated on the chart existing, so uncommenting it
#                      early is harmless, just pointless.
#   ci/sonar-complexity.yml — cognitive-complexity tier for Python script
#                      entry points, OFF BY DEFAULT (issue #41). A proxy
#                      metric that false-positives on legitimately branchy
#                      dispatch code — read ci/sonar-complexity.yml's header
#                      and CLAUDE.md's "What this gate can and cannot tell
#                      you" before uncommenting it, and re-derive its
#                      threshold against your own scripts/ rather than
#                      keeping the shipped number.
#
# To add a stack, uncomment its include line. Multiple stacks can coexist.

# ─── Catalog components ───────────────────────────────────────────────────────

include:
  - component: gitlab.com/components/sast/sast@~latest
    inputs:
      stage: security
      enable_mr_pipelines: true
  - component: gitlab.com/components/secret-detection/secret-detection@~latest
    inputs:
      stage: security
      enable_mr_pipelines: true
  # docs.yml is NOT stack-conditional the way the four below are — it has its
  # own `exists:` rule and does nothing in a clone with no docs site. See
  # ci/docs.yml.
  - local: ci/docs.yml
  # ── Stack-specific includes (uncomment as needed) ──
  # - local: ci/python.yml
  # - local: ci/node.yml
  # - local: ci/docker.yml
  # - local: ci/go.yml
  # - local: ci/helm.yml
  # - local: ci/sonar-complexity.yml

# ─── Workflow (GitLab Flow) ───────────────────────────────────────────────────
#
# Pipeline triggers:
#   - MR pipelines: lint + test + security (gate before merging to main)
#   - main branch:  lint + test + security + deploy to staging
#   - production:   deploy to production (tests already passed on main)
#   - Tags:         release pipeline (docs deploy, etc.)
#
# Suppress branch pipelines when an MR is already open — the MR pipeline
# covers the same commit, so running both wastes runner time.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "production"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - test
  - security
  - deploy

# ─── Deploy templates ────────────────────────────────────────────────────────
#
# Uncomment and customize these jobs for your deployment targets.
# They use GitLab environments for deploy tracking and approval gates.

# deploy-staging:
#   stage: deploy
#   environment:
#     name: staging
#     url: https://staging.example.com
#   rules:
#     - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
#   script:
#     - echo "Deploy to staging"  # Replace with your deploy command

# deploy-production:
#   stage: deploy
#   environment:
#     name: production
#     url: https://example.com
#   rules:
#     - if: '$CI_COMMIT_BRANCH == "production"'
#   script:
#     - echo "Deploy to production"  # Replace with your deploy command

# Auto-retry on runner infrastructure failures only — never on script failures.
default:
  interruptible: false
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ─── Rule templates ──────────────────────────────────────────────────────────

.on-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── Changelog check (MR only) ──────────────────────────────────────────────
#
# Fails when no changelog fragment was added and the MR contains changes that
# warrant a changelog entry. Auto-skips for CI config, docs, tests, and tooling.
#
# Fragment naming: <issue-or-slug>.<type>.md  (e.g. 42.fixed.md)
# Valid types: added, changed, fixed, security
# Skip manually with the ~no-changelog label.

changelog-check:
  extends: .on-mr
  stage: lint
  image: alpine:3.19
  before_script:
    - apk add --no-cache git
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=20
    - BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD || echo "")
    - |
      if [ -z "$BASE" ]; then
        echo "INFO — could not determine merge base; skipping changelog check."
        exit 0
      fi
    - |
      if echo "$CI_MERGE_REQUEST_LABELS" | tr ',' '\n' | grep -qx 'no-changelog'; then
        echo "INFO — 'no-changelog' label present; skipping."
        exit 0
      fi
    - |
      # Auto-skip for chore/ branches (dependency bumps, CI config, tooling)
      BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}"
      if echo "$BRANCH" | grep -qE '^chore/'; then
        echo "INFO — chore/ branch; skipping changelog check."
        exit 0
      fi
    - CHANGED=$(git diff --name-only $BASE HEAD)
    - |
      # Strip files that never need a changelog entry
      MEANINGFUL=$(echo "$CHANGED" | grep -Ev '^\.gitlab(-ci\.yml|/)' || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev '^(docs/|README|CLAUDE\.md|\.gitignore|Makefile|scripts/|mkdocs\.yml)' || true)
      MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev '\.(md|sh)$' || true)
      # Add your test directories here:
      # MEANINGFUL=$(echo "$MEANINGFUL" | grep -Ev '^(tests/|spec/)' || true)
      if [ -z "$MEANINGFUL" ]; then
        echo "INFO — only non-product files changed; skipping changelog check."
        exit 0
      fi
    - |
      HAS_FRAGMENT=$(echo "$CHANGED" | grep -c '^changelog\.d/.*\.\(added\|changed\|fixed\|security\)\.md$' || true)
      HAS_CHANGELOG=$(echo "$CHANGED" | grep -c 'CHANGELOG.md' || true)
      if [ "$HAS_FRAGMENT" -gt 0 ]; then
        echo "OK — changelog fragment found."
      elif [ "$HAS_CHANGELOG" -gt 0 ]; then
        echo "OK — CHANGELOG.md updated directly."
      else
        echo "ERROR — No changelog fragment found." >&2
        echo "" >&2
        echo "  Add a file to changelog.d/ named: <issue-or-slug>.<type>.md" >&2
        echo "  Valid types: added, changed, fixed, security" >&2
        echo "  Example:  echo 'Description of change (#42)' > changelog.d/42.fixed.md" >&2
        echo "" >&2
        echo "  Or apply the ~no-changelog label if this MR genuinely needs no entry." >&2
        exit 1
      fi

# ─── Harness gates ──────────────────────────────────────────────────────────
#
# See scripts/CLAUDE.md for the rules these follow. In short: a gate must
# be able to fail, must fail closed when it cannot reach its oracle, and must
# scan the repository rather than the working directory.

# Every gate runs its OWN --self-test FIRST, in its own job, before the real
# scan. Not in a shared self-test job: a blind gate reports OK on every tree, so
# a green from an untested gate is worth nothing — and the half that rots is
# DISCOVERY, which is environment-dependent. An image whose grep rejects
# `--exclude-dir` turns a scan into a permanent clean report, and a self-test
# that ran in a different job ran on a different image and proved nothing about
# this one. Same job is the only way to say "same image".

# Asserts the rule above holds for every gate in this file. Without it the rule
# is prose, and a gate added without a self-test is indistinguishable from one
# that works.
gate-selftest-parity:
  stage: lint
  image: alpine:3.19
  before_script:
    # gawk explicitly: this gate attributes each invocation to a job block, and a
    # BusyBox awk that parses the blocks differently would change what it sees.
    # The in-job --self-test would catch that — this just removes the coin flip.
    - apk add --no-cache bash git grep gawk
  script:
    - bash scripts/check-gate-selftest-parity.sh --self-test
    - bash scripts/check-gate-selftest-parity.sh

# Every CI gate script must be runnable before a push, or `make pre-push` is
# green about a smaller set than CI checks. Derives the CI set from this file
# rather than restating it, so a newly added gate cannot fall behind silently.
prepush-parity:
  stage: lint
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash git grep make
  script:
    - bash scripts/check-prepush-parity.sh --self-test
    - bash scripts/check-prepush-parity.sh

# An MR description that admits a follow-up must name an OPEN issue for it. Upstream,
# three merged MRs in one audit said "a follow-up would settle it" with no issue behind
# the sentence, and the owed work vanished at merge. The description is fetched from
# the API at job time, so editing the text and retrying this job re-checks it. Fails
# closed on an unresolvable issue lookup; a private project sets MR_FOLLOWUPS_TOKEN.
mr-followups:
  stage: lint
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash curl jq grep sed gawk
  script:
    # Self-test first: a failing description must not hide a broken detector.
    - bash scripts/check-mr-followups.sh --self-test
    - bash scripts/check-mr-followups.sh

# STUB/WIP markers never merge; TODO(#N) and SUPPRESSED-UNTIL(#N) must name an
# OPEN issue. Runs on MRs (a new marker names a real, open issue) AND on the
# default branch on a schedule — the interesting case, a marker that went stale
# because someone closed its issue, is not a diff event at all.
stale-references:
  stage: lint
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    # GNU grep explicitly: BusyBox grep rejects --exclude-dir, and a gate that
    # swallows that error reports "no matches" on every tree, forever.
    - apk add --no-cache bash git grep python3 curl
    - apk add --no-cache glab || echo "glab unavailable — issue lookups will fail closed"
  script:
    - bash scripts/check-stale-references.sh --self-test
    - bash scripts/check-stale-references.sh

# No early-exit reader (grep -q / grep -m / head) sits behind a pipe in any
# shell script. Under `set -o pipefail` such a reader can SIGPIPE its writer, so
# the pipeline returns 141 and a PRESENT match reads as missing. The class has a
# clean pass as its failure mode: upstream it reached `release.sh`'s duplicate-tag
# guard, where a spurious 141 lets a release proceed against a tag that exists.
# Scans every shell file under scripts/, hooks/ and .claude/hooks/ rather than a
# hand-listed set — a list only ever covers the files already bitten.
sigpipe-readers:
  stage: lint
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    # GNU grep explicitly: BusyBox grep's ERE differs enough to change what the
    # offender pattern matches, and a gate that matches less is a silent pass.
    - apk add --no-cache bash git grep sed findutils
  script:
    - bash scripts/check-sigpipe-readers.sh --self-test
    - bash scripts/check-sigpipe-readers.sh

# GitLab marks a job successful when its artifact upload found nothing. Every
# tag-triggered job that declares artifacts:paths must end its script with
# `sh scripts/ci-assert-artifacts.sh <each path>`. This checks that wiring
# statically, since a tag-only job never runs before the tag it breaks.
artifact-assertions:
  stage: lint
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash python3 findutils
  script:
    - bash scripts/check-artifact-assertions.sh --self-test
    - bash scripts/check-artifact-assertions.sh

# Every shell file under scripts/, hooks/ and .claude/hooks/ passes shellcheck
# at its default severity. Added after a bashism (`&>` in a #!/bin/sh hook,
# SC3020) blocked every commit on dash/busybox systems while looking clean on
# macOS — see issue #14. hooks/ and .claude/hooks/ are in on purpose: they run
# on every contributor's machine and are the two trees no other gate reads.
shellcheck:
  stage: lint
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash git grep sed findutils shellcheck
  script:
    - bash scripts/check-shellcheck.sh --self-test
    - bash scripts/check-shellcheck.sh

# No tracked file git resolves to `text: set` may contain a literal 0x00 byte.
# A NUL makes git classify the whole file as BINARY no matter what
# .gitattributes says: `git diff` shows "Binary files ... differ" instead of a
# line, `git grep` finds nothing inside it, and a plain `grep -r` sweep across
# the tree returns a false clean rather than an error — silently defeating
# every other gate in this file that walks the tree with grep. Enumerates from
# the git index, never a filesystem walk, so a gitignored file is never a
# candidate. See scripts/check-nul-bytes.sh for the two buckets this
# deliberately leaves out of scope (text=unset encoding fixtures, text=auto).
nul-bytes:
  stage: lint
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash git python3
  script:
    - bash scripts/check-nul-bytes.sh --self-test
    - bash scripts/check-nul-bytes.sh

# Every call site this repo declared load-bearing is still there. The class: a
# guard installed by ONE line — a validator at the top of a shared setup helper,
# a hook entry in a config file, an ignore filter inside a tree walk — where
# deleting that line leaves the whole suite green and the guard simply stops
# guarding. Nothing else in this pipeline goes red for that, which is the entire
# reason the declaration exists. Declarations live in load-bearing.declarations;
# a repo that has declared nothing passes trivially and says so, which is why
# the --self-test below is what proves the machinery works at all.
load-bearing:
  stage: lint
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    # git is not optional here: a declared path that git IGNORES resolves
    # locally and is absent from this clean clone, and the gate refuses such a
    # declaration rather than letting one side of that pair be the answer.
    - apk add --no-cache bash git grep
  script:
    - bash scripts/check-load-bearing.sh --self-test
    - bash scripts/check-load-bearing.sh

# Every version-bearing manifest declares the same version, and none is behind
# the last released CHANGELOG section. Runs on EVERY MR, not at tag time: by
# tag time the artifact is already being built from the manifest that drifted.
version-lockstep:
  stage: lint
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash git python3
  script:
    - python3 scripts/check-version-lockstep.py --self-test
    - python3 scripts/check-version-lockstep.py

# A tag pipeline is NOT the branch pipeline running again. Pipelines are
# triggered per ref, so pushing the release branch and the tag at one commit
# starts two independent pipelines, and every job whose rule reads
# `$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH` or a merge_request_event — which is
# most of this file — does not exist in the tag's. Nothing links them, so
# without this a tag publishes happily from a commit whose own branch pipeline
# is red. Give every tag-triggered publish or deploy job `needs:
# [release-pipeline-gate]`; a job with no `needs:` only waits for earlier
# STAGES, which is not the same promise.
release-pipeline-gate:
  stage: lint
  image: alpine:3.19
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache bash git python3 curl
  script:
    - bash scripts/check-release-pipeline.sh --self-test
    - bash scripts/check-release-pipeline.sh

# Blueprint used to run a `release-tag` / `release-publish` CI job pair here
# (scripts/publish-release.sh) that tagged and published the GitLab release
# automatically once a `chore: release vX.Y.Z` commit landed on main. Retired
# in #56: `release-tag`'s rule matched `$CI_COMMIT_MESSAGE` against
# `/^chore: release v/`, but GitLab CI rule regexes use RE2, where `^` is a
# *string* anchor, not a line anchor — and a real GitLab merge commit's
# message puts the MR title on the SECOND line, after "Merge branch '...'
# into 'main'". The rule never matched a real merge commit; confirmed on the
# v0.5.0 cut, where the job did not run at all, not even as a failure. On top
# of that, it needed a masked+protected RELEASE_TOKEN CI/CD variable that was
# never configured, so even a matching rule would have failed closed.
#
# The two commands those jobs ran are simpler run by hand right after the
# release MR merges — see the `release` skill's Step 5:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#   glab release create vX.Y.Z --notes-file docs/releases/vX.Y.Z.md
# This is also how TruePPM, the sibling project this harness cross-pollinates
# lessons with, runs its own release.sh — no CI-side auto-tag step, the human
# or agent running the release pushes the tag directly.
#
# release-pipeline-gate stays below: it's generic, reusable infrastructure
# for a downstream project's OWN tag-triggered publish jobs (Docker/npm/PyPI
# images), not specific to the automation this repo just removed.

# Scripts that carry a --self-test but are not themselves CI gates (they run at
# release time, from a developer's machine). They have no job of their own to
# self-test inside, so they get this one.
tooling-self-tests:
  stage: lint
  image: alpine:3.19
  before_script:
    # jq is here for scripts/tests/pre-mr-security-gate.test.sh — the hook
    # itself both reads its PreToolUse event JSON and writes its
    # permissionDecision output through jq.
    - apk add --no-cache bash git grep python3 jq
  script:
    - bash scripts/assemble-changelog.sh --self-test
    # Its real run reads the forge's open-MR list, so it has no gate job of its
    # own; the self-test replaces that call with a fixture and is hermetic.
    - bash scripts/check-issue-collision.sh --self-test
    - bash scripts/release.sh --self-test
    - bash scripts/release-notes.sh --self-test
    # Its real run needs a `v*` tag to diff against, which only exists at
    # release time; the self-test builds its own throwaway git history.
    - bash scripts/check-tag-only-jobs.sh --self-test
    - python3 scripts/adr-accepted-issue-sweep.py --self-test
    # The real memory check reads a per-user directory outside the repo and never
    # runs here; its self-test is hermetic (temp dirs only), so it does.
    - bash scripts/check-memory-index.sh --self-test
    - bash scripts/tests/wt-args.test.sh
    - bash scripts/tests/wt-prune.test.sh
    - bash scripts/tests/wt-ports.test.sh
    - bash scripts/tests/wt-lock.test.sh
    # The pre-MR security gate hook is not itself a CI gate (it's a Claude Code
    # PreToolUse hook), so it has no job of its own — same bucket as the wt-*
    # tests above.
    - bash scripts/tests/pre-mr-security-gate.test.sh
    # setup-hooks.sh is an installer, not a CI gate — it has no job of its own
    # either. Needs `git worktree add`, which this job's git package provides.
    - bash scripts/tests/setup-hooks.test.sh

# ─── Application-aware gates against a real application tree (#52) ─────────
#
# The gates that read application code — OpenAPI/TypeScript parity, real-time
# event reachability, migration numbering, added-file coverage — live in
# ci/python.yml and ci/node.yml, which THIS repo does not include, and each
# skips cleanly on Blueprint's own tree because it has no backend/ or
# frontend/ to find. So none of them had ever executed its real logic in any
# pipeline. This job runs all four against an app fixture the runner
# generates into a temp dir (a small Django/DRF-and-React-shaped app in the
# shapes drf-spectacular, coverage.py and vitest actually emit; never
# committed, so it cannot ship into downstream clones): each must pass the
# fixture and reject a seeded violation. Its first run found three gate bugs — see the runner's header.
#
# node:20-alpine is the image ci/node.yml's added-files-covered job uses; the
# Python gates get python3 from apk. BusyBox is the userland either way, which
# is what the runner must survive. `changes:` keeps it off MR pipelines that
# cannot affect it; on main it always runs.
app-fixture-gates:
  stage: test
  image: node:20-alpine
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/check-serializer-ts-parity.py
        - scripts/check-ws-event-reachability.py
        - scripts/check-migration-numbering.sh
        - scripts/check-added-files-covered.mjs
        - scripts/tests/app-fixture-gates.test.sh
        - scripts/tests/lib/app-fixture.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash git python3
  script:
    - bash scripts/tests/app-fixture-gates.test.sh

# `make setup`, `scripts/customize.sh`, `scripts/doctor.sh`, and `/kickoff` are
# the entire first-run experience for a brand-new clone of this template, and
# nothing else in this file ever ran any of them (issue #53) — the same
# "green CI proves nothing" shape the duplicate-tag guard hit under `pipefail`
# (#7), just on the one path every adopter takes on day one.
#
# `/kickoff` itself is an interactive Claude Code skill that has a model hold
# a conversation and hand-write CLAUDE.md / .claude/personas.md
# (`disable-model-invocation: true` — there is no deterministic input surface
# to drive from a CI job). `scripts/customize.sh` is what CAN run
# deterministically here: it never prompts, it only scans the tree and
# reports, so it needed no new non-interactive flag. This job proves the
# other side of that contract — scripts/tests/customize-e2e.test.sh builds a
# scratch clone from `git archive HEAD`, asserts it starts un-customized,
# simulates a completed /kickoff, asserts customize.sh then reports clean
# with no leftover placeholder token, and smoke-runs doctor.sh against that
# same tree — plus two automated negative controls proving customize.sh
# still fails if a placeholder survives.
#
# Not in tooling-self-tests above: that job runs unconditionally every
# pipeline by design (cheap, hermetic self-tests). This one is scoped to the
# onboarding surface specifically, per issue #53, and stays its own job/script
# so it doesn't collide with other CI work landing on this file in parallel.
onboarding-customize-e2e:
  stage: lint
  image: alpine:3.19
  rules:
    - changes:
        - scripts/customize.sh
        - scripts/doctor.sh
        - scripts/setup-hooks.sh
        - scripts/lib/git-hooks-dir.sh
        - scripts/tests/customize-e2e.test.sh
        - CLAUDE.md
        - .claude/personas.md
        - .claude/hooks/post-edit-checks.sh
        - CONTRIBUTING.md
        - Makefile
        - .gitlab-ci.yml
        - scripts/release.sh
        - .env.example
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash git make python3 grep
  script:
    - bash scripts/tests/customize-e2e.test.sh

# ─── Dependency and secret scanning (stage: security) ───────────────────────
#
# The SAST and secret-detection catalog components included at the top of
# this file REPORT; neither turns a finding into a blocked pipeline. These
# two jobs are the half that gates:
#
#   - osv-scan classifies OSV-Scanner's advisory findings by severity and
#     fails the pipeline at or above a configurable threshold.
#   - gitleaks-scan is a second, independently-rulesetted secret scanner over
#     the FULL working tree (the secret-detection component is diff-scoped),
#     and is also wired as a pre-commit hook — the only placement that can
#     stop a secret before it is ever committed, since every CI job here only
#     runs after a push.
#
# Same rules as every other gate in this file (scripts/CLAUDE.md): self-test
# first, in the SAME job, before the real scan.

# OSV-Scanner: dependency vulnerability scan against the OSV.dev advisory
# database, covering every ecosystem it supports (npm, PyPI, Go modules, and
# 20+ others). `--recursive` auto-discovers whatever lockfiles exist in the
# tree — no per-stack wiring, so this job needs no changes as stacks are
# uncommented in Includes above. Runs unconditionally, not gated on
# `changes:` — an advisory can be published against a version already
# sitting in an unchanged, committed lockfile, so a changes-gated rule would
# only ever catch it after it had already shipped on main.
#
# OSV-Scanner has no native severity threshold (confirmed on v2.3.8: no
# --severity / --fail-on / --audit-level flag), so it exits non-zero on ANY
# advisory. scripts/osv-severity-gate.sh classifies the JSON output against
# OSV_SEVERITY_THRESHOLD — see that script's header for the full exit-code
# contract, and for ALLOW_UNRESOLVED, the named opt-out for a scan that
# genuinely could not reach the advisory database.
#
# `--allow-no-lockfiles` makes "nothing to scan" — a template clone with no
# stack enabled yet — a clean pass rather than a hard error: verified
# locally, it exits 0 and writes `{"results": null}`, which the gate treats
# identically to an empty result set. A genuine scan failure (verified
# locally against an unreachable proxy: osv-scanner exits non-zero and writes
# NO output file at all — not empty, absent) is exactly what the gate's
# missing-file fail-closed path exists for; `|| true` below only swallows the
# "advisories found" exit code, never masks that distinction.
#
# Runs on alpine + a pinned binary download rather than the distroless
# ghcr.io/google/osv-scanner image: the severity gate needs a shell and jq,
# which the distroless image doesn't have.
osv-scan:
  stage: security
  needs: []
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    # Per clone: LOW, MEDIUM, HIGH, or CRITICAL — see scripts/osv-severity-gate.sh.
    OSV_SEVERITY_THRESHOLD: "HIGH"
  allow_failure:
    exit_codes:
      - 2
  before_script:
    - apk add --no-cache wget jq
    - wget -q -O /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64"
    - chmod +x /usr/local/bin/osv-scanner
  script:
    # Write the JSON report first. osv-scanner exits non-zero both when
    # advisories are found (expected — severity banding is delegated to the
    # gate below) and when the scan fails outright (network down); `|| true`
    # lets either continue to the gate, which tells them apart by whether a
    # valid results file exists.
    - osv-scanner scan source --recursive --allow-no-lockfiles . --format json --output-file osv-report.json || true
    # Self-test FIRST, in this SAME job, before trusting the real verdict —
    # per scripts/CLAUDE.md, same job is the only way to say "same image".
    - sh scripts/osv-severity-gate.sh --self-test
    - sh scripts/osv-severity-gate.sh osv-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - osv-report.json

# gitleaks: full working-tree secret scan using the upstream default
# ruleset, backed by the documented allowlist in .gitleaks.toml
# (auto-discovered at the repo root). Complements the GitLab secret-detection
# component included at the top of this file — different implementation and
# ruleset — and, unlike it, is not limited to a diff: `gitleaks dir .` scans
# every file in the checkout, unconditionally, since a secret can land in any
# file regardless of what changed.
#
# Also wired as a local pre-commit hook (scripts/gitleaks-precommit.sh, via
# scripts/setup-hooks.sh / hooks/pre-commit) — this job is the hard,
# merge-blocking gate; the hook is the earliest possible local catch, and
# matters specifically for a branch with no open MR yet, which per the
# workflow rules above gets zero CI until one exists.
gitleaks-scan:
  stage: security
  needs: []
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    # bash + git are for the self-test below (a throwaway repo, and the
    # hook script's own shebang); gitleaks itself needs neither.
    - apk add --no-cache bash git wget
    - wget -q -O /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - chmod +x /usr/local/bin/gitleaks
  script:
    # Self-test FIRST, in this SAME job — the one place in CI where the
    # gitleaks binary the self-test's detection case needs is guaranteed
    # present, so it is also the only place that proof can run at all.
    - bash scripts/gitleaks-precommit.sh --self-test
    - gitleaks dir . --no-banner --redact --exit-code 1

# ─── Documentation site (Astro Starlight → GitLab Pages) ────────────────────
#
# Two jobs, deliberately split: website:build compiles and VERIFIES the site;
# pages publishes that already-verified artifact without rebuilding. GitLab
# requires the publish job be named exactly "pages" with output in public/.
#
# A green `astro build` is not proof the docs rendered — Starlight's content
# loader catches a per-page render error, drops that page's whole body, and
# still exits 0. The verification step below is what actually proves
# something: every source page must have produced an output file, and that
# file must be larger than a bare-chrome shell.

website:build:
  stage: test
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd website
    - npm ci
  script:
    - npm run build
    - |
      MIN_BYTES=2000
      : > /tmp/docs-build-failures
      find src/content/docs -type f \( -name '*.md' -o -name '*.mdx' \) | while IFS= read -r src; do
        rel="${src#src/content/docs/}"
        rel="${rel%.mdx}"
        rel="${rel%.md}"
        if [ "$rel" = "index" ]; then
          out="dist/index.html"
        else
          out="dist/${rel}/index.html"
        fi
        if [ ! -f "$out" ]; then
          echo "MISSING build output for $src -> $out"
          echo x >> /tmp/docs-build-failures
          continue
        fi
        bytes=$(wc -c < "$out")
        if [ "$bytes" -lt "$MIN_BYTES" ]; then
          echo "SUSPICIOUSLY SMALL ($bytes bytes, expected >= $MIN_BYTES) — $out (from $src)"
          echo x >> /tmp/docs-build-failures
        fi
      done
      if [ -s /tmp/docs-build-failures ]; then
        echo "Docs build verification FAILED — see missing/undersized pages above."
        exit 1
      fi
      echo "Docs build verification passed: every source page rendered a non-trivial output file."
  artifacts:
    paths:
      - website/dist
    expire_in: 1 week

pages:
  stage: deploy
  image: alpine:3.19
  needs: ["website:build"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - mv website/dist public
  artifacts:
    paths:
      - public

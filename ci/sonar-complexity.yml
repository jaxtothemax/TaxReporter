# ─── Cognitive-complexity tier for script entry points (issue #41) ─────────
#
# OFF BY DEFAULT — unlike ci/docs.yml (included unconditionally, self-gated by
# `exists:`), this file follows the ci/python.yml / ci/node.yml / ci/docker.yml
# / ci/go.yml / ci/helm.yml convention: it stays commented out in
# .gitlab-ci.yml until a project deliberately uncomments the include line.
# Nothing here runs, and nothing in a clone's pipeline changes, until that
# happens — see the "Honest framing" section of #41: a cognitive-complexity
# number is a proxy, it produces false positives on legitimately branchy
# dispatch code, and a hard gate trained on it teaches people to restructure
# code to satisfy a metric rather than a reader. Opt-in is how that risk is
# kept from landing on anyone who did not choose it.
#
# What it checks: scripts/check-cognitive-complexity.py — a LOCAL, OFFLINE
# approximation of SonarSource's Cognitive Complexity metric (rule S3776),
# scored against module-level ("entry point") functions in files matching
# COMPLEXITY_PATTERN. It is explicitly NOT a SonarCloud/SonarQube scan — see
# the script's own module docstring for why a real Sonar analysis (an
# external, network-reached, token-configured oracle) would be the wrong
# shape for this repo's own pre-push/CI gates, and for exactly what this
# approximation does and does not cover.
#
# THE THRESHOLD IS NOT A DEFAULT TO COPY. It is derived from THIS repo's own
# scripts/*.py — see DEFAULT_THRESHOLD's comment in the script for the
# measurement and the two reviewed exceptions it left in place, suppressed
# rather than force-extracted. A project enabling this against its OWN
# scripts should run `python3 scripts/check-cognitive-complexity.py --list`
# first and re-derive its own number; keeping the shipped 15 unexamined is
# exactly the "copied number with no provenance" #41 rejects.
#
# Suppressing a verified false positive: a reasoned trailing comment on the
# `def` line, following the same shape as `# sigpipe-ok: <reason>` in
# scripts/check-sigpipe-readers.sh (scripts/CLAUDE.md, "Prefer a marker that
# means one thing") — see the script's docstring for the exact form. A bare
# marker with no reason does not suppress anything; it still counts as an
# offender, with a message pointing that out.
#
# Customize:
#   - COMPLEXITY_PATTERN: glob(s), repo-relative, of Python files to score
#     (default: scripts/*.py — the same domain scripts/CLAUDE.md governs).
#     Pass more than one pattern by repeating --pattern in the script line
#     below if your entry points live elsewhere too (e.g. tools/*.py).
#   - COMPLEXITY_THRESHOLD: see above — re-derive, do not copy.

variables:
  COMPLEXITY_PATTERN: "scripts/*.py"
  COMPLEXITY_THRESHOLD: "15"

cognitive-complexity:
  stage: lint
  image: python:3.12-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # Self-test FIRST, in this SAME job — check-gate-selftest-parity.sh
    # requires it, and scripts/CLAUDE.md explains why "ran in a different
    # job" proves nothing: it is evidence about a different image.
    - python3 scripts/check-cognitive-complexity.py --self-test
    - python3 scripts/check-cognitive-complexity.py --pattern "$COMPLEXITY_PATTERN" --threshold "$COMPLEXITY_THRESHOLD"

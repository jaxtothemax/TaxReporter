# ─── Node.js CI jobs ─────────────────────────────────────────────────────────
#
# Include this file from .gitlab-ci.yml:
#   include:
#     - local: ci/node.yml
#
# Prerequisites:
#   - package.json and package-lock.json in the repo root or frontend/
#   - Adjust NODE_DIR below if your Node code lives in a subdirectory
#
# Customize:
#   - NODE_DIR: directory containing your Node.js code (default: ".")
#   - MAX_LINT_WARNINGS: eslint --max-warnings threshold (default: 0)

variables:
  NODE_DIR: "."
  MAX_LINT_WARNINGS: "0"

.npm-cache:
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      prefix: "npm"
      files: [$NODE_DIR/package-lock.json]
    paths:
      - .npm/
      - $NODE_DIR/node_modules/
    policy: pull

node-lint:
  extends: .npm-cache
  stage: lint
  image: node:20-alpine
  variables:
    NODE_OPTIONS: "--max-old-space-size=512"
  rules:
    - changes:
        - $NODE_DIR/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd $NODE_DIR
    - npm ci --prefer-offline
  script:
    - npm run lint -- --max-warnings $MAX_LINT_WARNINGS

node-test:
  extends: .npm-cache
  stage: test
  needs: []
  image: node:20-alpine
  variables:
    NODE_OPTIONS: "--max-old-space-size=512"
  rules:
    - changes:
        - $NODE_DIR/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - cd $NODE_DIR
    - npm ci --prefer-offline
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml --coverage
  coverage: '/All files\s+\|\s+(\d+(?:\.\d+)?)\s+\|/'
  artifacts:
    reports:
      junit: $NODE_DIR/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: $NODE_DIR/coverage/cobertura-coverage.xml
    when: always

node-license-check:
  extends: [.npm-cache, .on-mr]
  stage: security
  image: node:20-alpine
  before_script:
    - cd $NODE_DIR
    - npm ci --prefer-offline
    - npx license-checker --production --failOn "GPL-2.0;GPL-3.0;AGPL-3.0"
  script:
    - echo "License check passed."

# ─── Added-files coverage gate (#44) ──────────────────────────────────────────
#
# diff-cover (and any line-diff coverage tool) only scores rows it finds in a
# coverage report. A brand-new source file with zero tests has no rows at
# all, so it contributes nothing to the denominator and reads as 100%
# covered instead of 0% — the failure mode is exactly backwards. See
# scripts/check-added-files-covered.mjs's own header for the configurable
# "layer" model (directory prefix + extensions + which coverage report and
# omit-config it reads).
#
# Runs in `security` stage (after `test`) because it needs the SAME-PIPELINE
# coverage reports python-test / node-test just produced — `needs:
# optional: true` means this still runs standalone in a Node-only or
# Python-only clone (the missing side's layer just has zero candidates), and
# `git` (not part of node:20-alpine by default) is what lets it diff against
# origin.
added-files-covered:
  extends: .on-mr
  stage: security
  image: node:20-alpine
  needs:
    - job: python-test
      artifacts: true
      optional: true
    - job: node-test
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache git
  script:
    - node scripts/check-added-files-covered.mjs --self-test
    - node scripts/check-added-files-covered.mjs

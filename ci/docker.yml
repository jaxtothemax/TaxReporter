# ─── Docker build verification ───────────────────────────────────────────────
#
# Uses kaniko (not Docker-in-Docker) — no privileged mode required.
# Builds the image but does not push (--no-push).
#
# Customize DOCKERFILE_PATH and CONTEXT_DIR for your project.

variables:
  DOCKERFILE_PATH: "Dockerfile"
  CONTEXT_DIR: "."

# ─── Compose project name pinning ────────────────────────────────────────────
#
# An unpinned Compose project `name:` derives from the CHECKOUT DIRECTORY, not
# from the file. Two default clones (dev + prod, or two worktrees of the same
# repo) resolve to the same project: bare volume names collide silently across
# stacks, and shared service names recreate each other's containers in place
# on `up`. Every standalone compose file (anything not matching Compose's own
# `*.override.yml` auto-merge convention) must pin its own, distinct `name:`.
# See scripts/check-compose-project-names.sh for the full scope and the
# override-file exception.
#
# Lives here, not in a root scripts/ gate: this job — and the Docker stack it
# checks — only exists for a project that uncomments this file. A project
# without Docker never runs it. The gate itself still passes (nothing to
# scan) if a project including this file has no compose files at all.
compose-project-names:
  stage: lint
  image: alpine:3.19
  rules:
    - changes:
        - docker-compose*.yml
        - docker-compose*.yaml
        - compose*.yml
        - compose*.yaml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash git grep sed findutils
  script:
    - bash scripts/check-compose-project-names.sh --self-test
    - bash scripts/check-compose-project-names.sh

docker-build:
  stage: test
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - changes:
        - Dockerfile*
        - docker-compose*.yml
        - requirements*.txt
        - package*.json
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - /kaniko/executor
        --context "$CI_PROJECT_DIR/$CONTEXT_DIR"
        --dockerfile "$CI_PROJECT_DIR/$DOCKERFILE_PATH"
        --no-push
